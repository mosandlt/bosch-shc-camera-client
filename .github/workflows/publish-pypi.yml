name: Publish to PyPI

# GATE (added 2026-08-07, CI_DOES_THE_RELEASE audit finding): quality.yml
# only triggers on push to main/PR, never on tag push, so a tag could
# previously reach PyPI without this exact commit ever having a green CI
# run of its own -- the same class of gap already closed for the Python
# CLI's publish-pypi.yml on 2026-07-15/16. `require-ci` polls quality.yml's
# conclusion on the tagged commit's SHA (which is the same commit as
# whatever push to main most recently ran it, since this repo tags straight
# off main with no separate release branch) and blocks `build`/`publish`
# until it reports SUCCESS.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  require-ci:
    name: Require CI to pass on this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Poll quality.yml for SUCCESS on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 2400 ))   # 40 min ceiling
          while :; do
            out=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml \
              --commit "$SHA" --limit 1 \
              --json conclusion,status \
              --jq '.[0] | (.conclusion // "none") + " " + (.status // "none")' \
              2>/dev/null || true)
            [ -z "$out" ] && out="none none"
            concl=${out%% *}
            echo "quality.yml -> conclusion=$concl"
            case "$concl" in
              success) break ;;
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::quality.yml concluded '$concl' on $SHA — refusing to publish"
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for quality.yml on $SHA"
              exit 1
            fi
            echo "Waiting for quality.yml..."
            sleep 25
          done

  build:
    name: Build distribution
    needs: require-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted-publisher auth

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # VERSION passed to awk via -v (never interpolated into the program
          # text) — GITHUB_REF_NAME is attacker-influenceable via the tag name,
          # so string interpolation there would be an awk/command-injection
          # vector. index() is a literal substring match, not a regex.
          awk -v ver="$VERSION" '
            index($0, "## [v" ver "]") == 1 { flag=1; next }
            /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::No CHANGELOG.md entry found for v${VERSION} — add a '## [v${VERSION}]' section before tagging."
            exit 1
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/release-notes.md
          fi
